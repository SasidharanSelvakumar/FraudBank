services:
  postgres:
    image: postgres:15-alpine
    container_name: fraudbank-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: fraudbank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fraudbank-backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: postgres://postgres:password123@postgres:5432/fraudbank
      JWT_SECRET: fraudbank_production_docker_jwt_key_2026
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fraudbank-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
